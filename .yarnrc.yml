changesetIgnorePatterns:
  - .github/**
  - .yarn/cache/**
  - "**/*.spec.{js,ts}"
  - "**/*.test-d.{js,ts}"
  - packages/docs/**

compressionLevel: 0

enableGlobalCache: false

nodeLinker: pnp

packageExtensions:
  lerna@*:
    dependencies:
      ci-info: "*"

supportedArchitectures:
  cpu:
    - x64
    - arm64
  libc:
    - current
    - glibc
  os:
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.14.1.cjs
