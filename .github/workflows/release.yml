name: Release
on:
  push:
    branches:
      - main
jobs:
  packages-release:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout 🔔
        uses: actions/checkout@v5
      - run: corepack enable
      - name: Node Setup 🔔
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: install 🔨
        run: yarn install --immutable
      - name: build 🔨
        run: yarn build:all
      - name: eslint 🚀
        run: yarn eslint
      - name: typecheck 🚀
        run: yarn typecheck
      - name: testing 🚀
        run: yarn test
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: yarn changeset:version
          publish-script: yarn changeset:publish
          # 기본값은 github.token 이며, v2 부터 env 의 GITHUB_TOKEN 은 읽지 않습니다.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changesets v3 는 Yarn Berry 에서 `yarn npm publish` 로 배포하며, Yarn 은 .npmrc 를 읽지 않습니다.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
